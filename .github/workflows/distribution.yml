name: Distribution contract

on:
  pull_request:
    paths:
      - ".github/workflows/distribution.yml"
      - "distribution/**"
      - "docs/next/website/**"
      - "docs/preview/**"
      - "docs/versions/**"
      - "scripts/agent_detection_manifest_check.py"
      - "scripts/config_reference_check.py"
      - "scripts/docs/**"
      - "scripts/docs_translation_parity.py"
      - "scripts/preview.py"
      - "scripts/test_agent_detection_manifest_check.py"
      - "scripts/test_config_reference_check.py"
      - "scripts/test_docs_translation_parity.py"
      - "scripts/test_preview.py"
      - "src/detect/manifest_update.rs"
      - "src/detect/manifests/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/distribution.yml"
      - "distribution/**"
      - "docs/next/website/**"
      - "docs/preview/**"
      - "docs/versions/**"
      - "scripts/agent_detection_manifest_check.py"
      - "scripts/config_reference_check.py"
      - "scripts/docs/**"
      - "scripts/docs_translation_parity.py"
      - "scripts/preview.py"
      - "scripts/test_agent_detection_manifest_check.py"
      - "scripts/test_config_reference_check.py"
      - "scripts/test_docs_translation_parity.py"
      - "scripts/test_preview.py"
      - "src/detect/manifest_update.rs"
      - "src/detect/manifests/**"

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Test documentation lifecycle
        run: bun test scripts/docs/*.test.ts

      - name: Validate published contract
        run: |
          python3 scripts/agent_detection_manifest_check.py --require-published
          python3 scripts/config_reference_check.py
          python3 scripts/docs_translation_parity.py --docs-root docs/next/website/src/content/docs
          node scripts/docs/preview.mjs check

      - name: Validate imported upstream documentation provenance
        # Published docs were imported from herdrdev/herdr. Fork release tags
        # can share version names but identify different commits.
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdtempSync, readFileSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const manifest = JSON.parse(readFileSync('docs/versions/manifest.json', 'utf8'));
          const tags = manifest.versions.filter(entry => entry.commit).map(entry => entry.tag);
          const gitDir = mkdtempSync(join(tmpdir(), 'herdr-upstream-docs-'));
          try {
            execFileSync('git', ['init', '--bare', gitDir], { stdio: 'inherit' });
            if (tags.length) {
              execFileSync('git', ['--git-dir', gitDir, 'fetch', '--depth=1', '--no-tags',
                'https://github.com/herdrdev/herdr.git',
                ...tags.map(tag => `refs/tags/${tag}:refs/tags/${tag}`)], { stdio: 'inherit' });
            }
            execFileSync('node', ['scripts/docs/versions.mjs', 'check'], {
              env: { ...process.env, GIT_DIR: gitDir }, stdio: 'inherit',
            });
          } finally {
            rmSync(gitDir, { recursive: true, force: true });
          }
          NODE

      - name: Test contract tooling
        run: |
          python3 -m unittest \
            scripts.test_agent_detection_manifest_check \
            scripts.test_config_reference_check \
            scripts.test_docs_translation_parity \
            scripts.test_preview
